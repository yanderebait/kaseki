# Builds the Windows installer. On a version tag (v*) it also publishes
# the GitHub release; a manual run only builds and keeps the installer
# as a downloadable workflow artifact.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    # Needed so the job can create the release and upload the installer.
    permissions:
      contents: write
    defaults:
      run:
        # Use bash for every step so the scripts below behave like on Linux.
        shell: bash
    steps:
      # Get the code at the commit or tag that triggered this run.
      - uses: actions/checkout@v4

      # Install Node 22 and reuse the npm download cache between runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # On a tag, stop early if the tag and package.json disagree
      # (e.g. tag v0.3.0 but package.json still says 0.2.9).
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      # npm runs package scripts with cmd.exe on Windows, but the postinstall
      # script (rebuild:native) uses bash syntax. Point npm at Git Bash.
      - name: Make npm run scripts with Git Bash
        run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"

      # Clean install of the exact locked dependencies. This also fetches the
      # prebuilt Windows SQLite binary for Electron via postinstall.
      - name: Install dependencies
        run: npm ci

      # Build the app and the NSIS installer. --publish never stops
      # electron-builder from trying to upload anything itself.
      - name: Build Windows installer
        run: npm run package:win -- --publish never

      # The in-app updater needs latest.yml, and the installer name inside it
      # must match the uploaded file exactly. Fail here rather than ship a
      # release the updater cannot use.
      - name: Check latest.yml matches the installer
        run: |
          version=$(node -p "require('./package.json').version")
          exe="Kaseki-Setup-${version}.exe"
          test -f "dist/${exe}" || { echo "dist/${exe} is missing" >&2; ls dist >&2; exit 1; }
          test -f "dist/${exe}.blockmap" || { echo "dist/${exe}.blockmap is missing" >&2; exit 1; }
          test -f dist/latest.yml || { echo "dist/latest.yml is missing" >&2; exit 1; }
          cat dist/latest.yml
          grep -q "^version: ${version}$" dist/latest.yml || { echo "latest.yml has the wrong version" >&2; exit 1; }
          grep -q "^path: ${exe}$" dist/latest.yml || { echo "latest.yml does not name ${exe}" >&2; exit 1; }
          grep -q "url: ${exe}$" dist/latest.yml || { echo "latest.yml files[] does not name ${exe}" >&2; exit 1; }

      # Run the packaged self-test inside the packaged Windows app. It leaves an
      # encrypted, closed (locked) database in its data folder, which the
      # second smoke launch below starts against.
      - name: Packaged self-test
        run: |
          data="${RUNNER_TEMP}/kaseki-selftest"
          rm -rf "${data}" "${data}-backups"
          set +e
          KASEKI_SELFTEST=1 KASEKI_DATA_DIR="${data}" timeout 600 ./dist/win-unpacked/Kaseki.exe > selftest.log 2>&1
          code=$?
          set -e
          echo "exit code ${code}; $(grep -c '^PASS' selftest.log || true) passed"
          grep '^FAIL' selftest.log || true
          if [ "${code}" -ne 0 ] || grep -q '^FAIL' selftest.log; then
            cat selftest.log >&2
            exit 1
          fi
          test -f "${data}/kaseki.db" || { echo "self-test left no database" >&2; exit 1; }

      # 0.3.2 shipped without starting: it died on launch, before its window
      # appeared. Launch the packaged app through its normal startup path (no
      # dev password, nothing unlocked) and require it to reach a loaded window
      # and exit cleanly. KASEKI_SMOKE=1 only makes it quit with exit code 0
      # once the window has loaded; a startup error exits 1 instead. Run once
      # with an empty data folder (first launch) and once against the locked
      # database the self-test left behind (every later launch).
      - name: Smoke test the packaged app starts
        run: |
          smoke() {
            local label="$1" data="$2"
            echo "--- ${label}"
            set +e
            KASEKI_SMOKE=1 KASEKI_DATA_DIR="${data}" timeout 120 ./dist/win-unpacked/Kaseki.exe > smoke.log 2>&1
            local code=$?
            set -e
            cat smoke.log
            cat "${data}"/logs/*.log 2>/dev/null || true
            if [ "${code}" -ne 0 ]; then
              echo "Packaged app failed to start (${label}): exit code ${code}" >&2
              exit 1
            fi
            grep -q 'Smoke run: window loaded' "${data}"/logs/*.log || {
              echo "Packaged app exited without loading its window (${label})" >&2
              exit 1
            }
            if grep -q '\[ERROR\]' "${data}"/logs/*.log; then
              echo "Packaged app logged an error while starting (${label})" >&2
              exit 1
            fi
          }
          rm -rf "${RUNNER_TEMP}/kaseki-smoke-empty"
          smoke "empty data folder" "${RUNNER_TEMP}/kaseki-smoke-empty"
          # Only this launch's log lines matter for the locked run.
          rm -rf "${RUNNER_TEMP}/kaseki-selftest/logs"
          smoke "locked database" "${RUNNER_TEMP}/kaseki-selftest"
          test -f "${RUNNER_TEMP}/kaseki-selftest/kaseki.db"

      # Keep the installer, its blockmap and latest.yml as a downloadable
      # artifact on every run.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaseki-windows-installer
          path: |
            dist/Kaseki-Setup-*.exe
            dist/Kaseki-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      # On a tag only: pull this version's section out of CHANGELOG.md
      # (from its "## x.y.z" heading up to the next "## " heading).
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No '## ${version}' section found in CHANGELOG.md" >&2
            exit 1
          fi

      # On a tag only: create the GitHub release with the installer, its
      # blockmap and latest.yml attached (the in-app updater reads all three).
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          exe="Kaseki-Setup-${version}.exe"
          gh release create "${GITHUB_REF_NAME}" "dist/${exe}" "dist/${exe}.blockmap" dist/latest.yml \
            --title "Kaseki ${version}" \
            --notes-file release-notes.md \
            --verify-tag
